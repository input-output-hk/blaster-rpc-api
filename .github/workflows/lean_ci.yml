name: Lean CI

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/lean_ci.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/lean_ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Add elan to PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan and lake
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            api/.lake
          key: ${{ runner.os }}-elan-${{ hashFiles('api/lean-toolchain', 'api/lake-manifest.json', 'api/lakefile.toml') }}
          restore-keys: |
            ${{ runner.os }}-elan-

      - name: Build API
        run: lake build
        working-directory: api
