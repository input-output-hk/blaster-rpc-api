defaultTargets = ["afv-rpc-api"]

[[lean_lib]]
name = "AfvRpcApi"

[[lean_exe]]
name = "afv-rpc-api"
root = "Main"
# Windows only: required so the Lean interpreter can resolve native symbols (e.g. UInt64.ofNatLT)
